version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    groups:
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Paris
    groups:
      frontend-runtime:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Paris
    groups:
      docker-runtime:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /infra/docker/backend
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Paris

  - package-ecosystem: docker
    directory: /infra/docker/nginx
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Paris

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Paris
    groups:
      github-actions-runtime:
        patterns:
          - "*"
