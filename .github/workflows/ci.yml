name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_PASSWORD: ci-postgres-password
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ghostscript

      - name: Validate Codex agent contracts
        run: python scripts/check_codex_agents.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements/dev.txt

      - name: Run Django checks
        run: python backend/manage.py check --settings=config.settings.test

      - name: Run production deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-prod-secret-a8F4zP9qK2mN7xR5a8F4zP9qK2mN7xR5a8F4zP9qK2mN7xR5
          DJANGO_ALLOWED_HOSTS: audit.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://audit.example.com
          DJANGO_EMAIL_HOST: smtp.audit.example.com
          PUBLIC_BASE_URL: https://audit.example.com
        run: python backend/manage.py check --deploy --fail-level WARNING --settings=config.settings.prod

      - name: Validate Docker Compose contracts
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Check for pending migrations
        run: python backend/manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run pip-audit
        run: pip-audit -r backend/requirements/prod.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Audit and build frontend assets
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build:assets

      - name: Verify generated frontend assets
        run: git diff --exit-code -- backend/static_src

      - name: Run Pytest
        run: pytest --ds=config.settings.test -ra --cov --cov-report=term-missing

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prenium_dtf_ci
          POSTGRES_USER: prenium_dtf_ci
          POSTGRES_PASSWORD: prenium_dtf_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prenium_dtf_ci -d prenium_dtf_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.ci
      POSTGRES_DB: prenium_dtf_ci
      POSTGRES_USER: prenium_dtf_ci
      POSTGRES_PASSWORD: prenium_dtf_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ghostscript

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements/dev.txt

      - name: Run Django checks on PostgreSQL
        run: python backend/manage.py check --settings=config.settings.ci

      - name: Run migrations on PostgreSQL
        run: python backend/manage.py migrate --settings=config.settings.ci --noinput

      - name: Run Pytest on PostgreSQL
        run: pytest --ds=config.settings.ci -ra

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
