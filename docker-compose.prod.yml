services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    container_name: preniumdtf-web
    image: prenium-dtf-backend-prod:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
      target: prod
      args:
        APP_REVISION: ${APP_REVISION:-unknown}
        APP_VERSION: ${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_STATIC_ROOT: ${DJANGO_STATIC_ROOT:-/var/app/static}
      DJANGO_MEDIA_ROOT: ${DJANGO_MEDIA_ROOT:-/var/app/media}
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SESSION_COOKIE_SECURE: "True"
      DJANGO_CSRF_COOKIE_SECURE: "True"
    command: ["sh", "infra/scripts/web-entrypoint.sh"]
    volumes:
      - django_static:/var/app/static
      - django_media:/var/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      # NAS Synology : manage.py healthcheck peut dépasser 5s au cold start.
      test: ["CMD-SHELL", "cd /app/backend && python manage.py healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s

  worker:
    image: prenium-dtf-backend-prod:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_STATIC_ROOT: ${DJANGO_STATIC_ROOT:-/var/app/static}
      DJANGO_MEDIA_ROOT: ${DJANGO_MEDIA_ROOT:-/var/app/media}
    command: ["sh", "infra/scripts/worker-entrypoint.sh"]
    volumes:
      - django_media:/var/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cd /app/backend && celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q OK",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    image: prenium-dtf-backend-prod:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: ["sh", "infra/scripts/beat-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    container_name: preniumdtf-nginx
    build:
      context: .
      dockerfile: infra/docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - django_static:/usr/share/nginx/prenium-static:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://127.0.0.1/static/css/app.css >/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  django_static:
  django_media:
