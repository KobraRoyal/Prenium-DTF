{% if slot == "networks" %}
{% if provider_id == "stripe" %}
<span class="client-billing-pay__chip client-billing-pay__chip--visa" title="Visa">
  <svg viewBox="0 0 40 24" width="40" height="24" aria-hidden="true" focusable="false">
    <rect width="40" height="24" rx="4" fill="#1A1F71" />
    <text x="20" y="16.2" text-anchor="middle" fill="#fff" font-size="11" font-weight="800" font-style="italic" font-family="Arial, Helvetica, sans-serif">VISA</text>
  </svg>
</span>
<span class="client-billing-pay__chip client-billing-pay__chip--mastercard" title="Mastercard">
  <svg viewBox="0 0 40 24" width="40" height="24" aria-hidden="true" focusable="false">
    <rect width="40" height="24" rx="4" fill="#111827" />
    <circle cx="16" cy="12" r="7" fill="#EB001B" />
    <circle cx="24" cy="12" r="7" fill="#F79E1B" />
    <path fill="#FF5F00" d="M20 6.6a7 7 0 0 1 0 10.8 7 7 0 0 1 0-10.8z" />
  </svg>
</span>
<span class="client-billing-pay__chip client-billing-pay__chip--cb" title="Cartes Bancaires">
  <svg viewBox="0 0 40 24" width="40" height="24" aria-hidden="true" focusable="false">
    <rect width="40" height="24" rx="4" fill="#0B3B8C" />
    <text x="20" y="16.4" text-anchor="middle" fill="#fff" font-size="11" font-weight="800" font-family="Arial, Helvetica, sans-serif">CB</text>
  </svg>
</span>
{% elif provider_id == "paypal" %}
<span class="client-billing-pay__chip client-billing-pay__chip--paypal" title="PayPal">
  <svg viewBox="0 0 84 24" width="84" height="24" aria-hidden="true" focusable="false">
    <rect width="84" height="24" rx="4" fill="#fff" />
    <rect x=".5" y=".5" width="83" height="23" rx="3.5" fill="none" stroke="#e2dccb" />
    <g transform="translate(8,3) scale(.75)" fill="#003087">
      <path d="M7.016 19.198h-4.2a.562.562 0 0 1-.555-.65L5.093.584A.692.692 0 0 1 5.776 0h7.222c3.417 0 5.904 2.488 5.846 5.5-.006.25-.027.5-.066.747A6.794 6.794 0 0 1 12.071 12H8.743a.69.69 0 0 0-.682.583l-.325 2.056-.013.083-.692 4.39-.015.087zM19.79 6.142c-.01.087-.01.175-.023.261a7.76 7.76 0 0 1-7.695 6.598H9.007l-.283 1.795-.013.083-.692 4.39-.134.843-.014.088H6.86l-.497 3.15a.562.562 0 0 0 .555.65h3.612c.34 0 .63-.249.683-.585l.952-6.031a.692.692 0 0 1 .683-.584h2.126a6.793 6.793 0 0 0 6.707-5.752c.306-1.95-.466-3.744-1.89-4.906z" />
    </g>
    <text y="16.2" font-size="12" font-weight="800" font-family="Arial, Helvetica, sans-serif">
      <tspan x="30" fill="#003087">Pay</tspan><tspan fill="#009CDE">Pal</tspan>
    </text>
  </svg>
</span>
{% endif %}
{% elif provider_id == "paypal" %}
<span class="client-billing-pay__brand client-billing-pay__brand--paypal" title="PayPal">
  <svg viewBox="0 0 40 24" width="40" height="24" aria-hidden="true" focusable="false">
    <rect width="40" height="24" rx="4" fill="#003087" />
    <g transform="translate(8,2) scale(.83)" fill="#fff">
      <path d="M7.016 19.198h-4.2a.562.562 0 0 1-.555-.65L5.093.584A.692.692 0 0 1 5.776 0h7.222c3.417 0 5.904 2.488 5.846 5.5-.006.25-.027.5-.066.747A6.794 6.794 0 0 1 12.071 12H8.743a.69.69 0 0 0-.682.583l-.325 2.056-.013.083-.692 4.39-.015.087zM19.79 6.142c-.01.087-.01.175-.023.261a7.76 7.76 0 0 1-7.695 6.598H9.007l-.283 1.795-.013.083-.692 4.39-.134.843-.014.088H6.86l-.497 3.15a.562.562 0 0 0 .555.65h3.612c.34 0 .63-.249.683-.585l.952-6.031a.692.692 0 0 1 .683-.584h2.126a6.793 6.793 0 0 0 6.707-5.752c.306-1.95-.466-3.744-1.89-4.906z" />
    </g>
  </svg>
</span>
{% elif provider_id == "stripe" %}
<span class="client-billing-pay__brand client-billing-pay__brand--card" title="Carte bancaire">
  <svg viewBox="0 0 40 24" width="40" height="24" aria-hidden="true" focusable="false">
    <rect width="40" height="24" rx="4" fill="#1A1815" />
    <rect x="8" y="6.5" width="24" height="11" rx="1.6" fill="none" stroke="#fff" stroke-width="1.5" />
    <rect x="8" y="8.8" width="24" height="2.4" fill="#fff" />
    <rect x="10.5" y="13.6" width="8" height="1.7" rx=".4" fill="#fff" opacity=".7" />
  </svg>
</span>
