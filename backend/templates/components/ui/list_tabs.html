{# Onglets / filtres de listes portail (liens ou boutons). #}
{# tabs : {label, count?, href?, is_active, is_empty?, id?, controls?, attrs?} #}
<nav class="ui-list-tabs{% if extra_class %} {{ extra_class }}{% endif %}" role="tablist" aria-label="{{ aria_label }}">
  {% for tab in tabs %}
    {% if element == "button" %}
    <button
      type="button"
      class="ui-list-tabs__tab{% if tab.is_active %} is-active{% endif %}{% if tab.is_empty %} is-empty{% endif %}"
      role="tab"
      aria-selected="{% if tab.is_active %}true{% else %}false{% endif %}"
      {% if tab.id %}id="{{ tab.id }}"{% endif %}
      {% if tab.controls %}aria-controls="{{ tab.controls }}"{% endif %}
    >
    {% else %}
    <a
      class="ui-list-tabs__tab{% if tab.is_active %} is-active{% endif %}{% if tab.is_empty %} is-empty{% endif %}"
      href="{{ tab.href }}"
      role="tab"
      {% if tab.is_active %}aria-current="page" aria-selected="true"{% else %}aria-selected="false"{% endif %}
      {% if tab.htmx %}hx-get="{{ tab.htmx.get }}" hx-target="{{ tab.htmx.target }}" hx-swap="{{ tab.htmx.swap }}"{% if tab.htmx.push_url %} hx-push-url="true"{% endif %}{% if tab.htmx.indicator %} hx-indicator="{{ tab.htmx.indicator }}"{% endif %}{% endif %}
    >
    {% endif %}
      <span class="ui-list-tabs__label">{{ tab.label }}</span>
      {% if tab.count != None %}<strong class="ui-list-tabs__count">{{ tab.count }}</strong>{% endif %}
    {% if element == "button" %}</button>{% else %}</a>{% endif %}
  {% endfor %}
</nav>
