<div
  class="ui-toast-stack"
  x-data="toastStack()"
  @prenium-toast.window="push($event.detail)"
  aria-live="polite"
  aria-relevant="additions"
>
  <template x-for="t in items" :key="t.id">
    <div
      class="ui-toast"
      :class="variantClass(t.variant)"
      :role="t.variant === 'error' ? 'alert' : 'status'"
    >
      <span class="ui-toast__mark" aria-hidden="true"></span>
      <p class="ui-toast__message" x-text="t.message"></p>
    </div>
  </template>
</div>
