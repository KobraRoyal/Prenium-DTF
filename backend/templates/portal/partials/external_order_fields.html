{% if form.non_field_errors %}
<div class="alert alert--danger" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
<div class="ui-field-group">
  <label class="ui-label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="muted">(facultatif)</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="ui-field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div class="error-text" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}
</div>
{% endfor %}
