<div class="b2b-quality-review b2b-quality-review--compact is-{{ review.level }}" aria-label="{{ review.label }}">
  <div class="b2b-quality-review__chips" role="group">
    <p class="b2b-quality-strip is-{{ review.level }}" title="{{ review.label }}">
      <strong class="b2b-quality-strip__label">{{ review.resolution_display }}</strong>
      <span class="ui-sr-only">{{ review.label }}</span>
    </p>
    {% if review.thin_zone.detected %}
    <p class="b2b-quality-strip is-warning" title="Détails inférieurs à 0,5 mm détectés.">
      <strong class="b2b-quality-strip__label">Zones &lt; 0,5 mm</strong>
    </p>
    {% endif %}
    {% if review.semi_transparency %}
    <p class="b2b-quality-strip {% if review.semi_transparency.detected %}is-warning{% else %}is-good{% endif %}">
      <strong class="b2b-quality-strip__label">{% if review.semi_transparency.detected %}Dégradés détectés{% else %}Pas de dégradé{% endif %}</strong>
    </p>
    {% endif %}
  </div>
</div>
