<form
  method="post"
  enctype="multipart/form-data"
  hx-encoding="multipart/form-data"
  hx-post="{% url 'portal:client-order-project-item-create' customer_public_id=customer.public_id project_public_id=project.public_id %}"
  hx-target="#order-project-items"
  hx-swap="outerHTML"
  hx-indicator="#portal-htmx-indicator"
  hx-disabled-elt="this"
  class="b2b-configurator__new"
  data-submit-loading
  data-add-visual-form
  data-batch-auto-submit
>
  {% csrf_token %}
  <div class="b2b-batch-dialog-copy">
    <p>Ajoutez jusqu’à cinq visuels. Dès le dépôt, leur contrôle technique démarre en arrière-plan.</p>
  </div>
  {% include "portal/client/partials/order_project_batch_dropzone.html" with input_id="id-add-visual-files" file_required=1 %}
  <div class="b2b-dialog-actions">
    <button class="ui-btn ui-btn-secondary" type="button" data-dialog-close>Annuler</button>
  </div>
</form>
