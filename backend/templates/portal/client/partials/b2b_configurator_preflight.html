{# Prévol compact : résolution, dégradés, finesse — détail dans title / sr-only. #}
<div
  class="b2b-configurator-preflight"
  data-configurator-preflight
  hidden
  aria-live="polite"
>
  <p class="b2b-quality-strip is-pending" data-preflight-dpi role="status">
    <strong class="b2b-quality-strip__label" data-preflight-dpi-label>Résolution</strong>
    <span class="ui-sr-only" data-preflight-dpi-meta></span>
  </p>
  <p class="b2b-quality-strip is-pending" data-preflight-fade role="status">
    <strong class="b2b-quality-strip__label" data-preflight-fade-label>Dégradés</strong>
    <span class="ui-sr-only" data-preflight-fade-meta></span>
  </p>
  <p class="b2b-quality-strip is-pending" data-preflight-thin role="status">
    <strong class="b2b-quality-strip__label" data-preflight-thin-label>Finesse</strong>
    <span class="ui-sr-only" data-preflight-thin-meta></span>
  </p>
</div>
