# TLS terminates at Synology reverse proxy; Docker nginx only sees HTTP.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

upstream django {
    server preniumdtf-web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Baked into the nginx image (see Dockerfile). Do not use /var/www/static:
    # on Synology an empty named volume often shadows that path.
    location /static/ {
        alias /usr/share/nginx/prenium-static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /healthz/ {
        proxy_pass http://django/healthz/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
