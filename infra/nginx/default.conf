# TLS terminates at Synology reverse proxy; en local, le schéma entrant reste HTTP.
# Upstream uses Compose service name `web` (works local + prod; container_name is optional).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $django_upstream http://web:8000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Baked into the nginx image (see Dockerfile). Local compose may bind-mount
    # static_src over this path for live JS/CSS without rebuild.
    location /static/ {
        alias /usr/share/nginx/prenium-static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /healthz/ {
        proxy_pass $django_upstream/healthz/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
